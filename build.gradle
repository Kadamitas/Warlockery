tasks.named('processResources', ProcessResources) {
    dependsOn generateEmptyGameTestStructure
    dependsOn generateLargeGameTestStructure
    dependsOn generateIsolationGameTestStructure
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('sourcesJar') {
    dependsOn generateEmptyGameTestStructure
    dependsOn generateLargeGameTestStructure
    dependsOn generateIsolationGameTestStructure
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('runGametest') {
    outputs.file layout.buildDirectory.file('gametest-results.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-Warlockery.txt' }
    }
    from(rootProject.file('changelog.txt')) {
        into 'META-INF'
        rename { 'CHANGELOG-Warlockery.txt' }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Automatic-Module-Name': 'com.kadamitas.warlockery',
            'Specification-Title': 'Warlockery',
            'Specification-Vendor': 'Kadamitas',
            'Specification-Version': project.version,
            'Implementation-Title': 'Warlockery',
            'Implementation-Vendor': 'Kadamitas',
            'Implementation-Version': project.version,
            'Implementation-URL': 'https://github.com/Kadamitas/Warlockery'
        )
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

def releaseDirectory = layout.projectDirectory.dir("release/${project.version}")

tasks.register('releaseBundle', ReleaseBundleTask) {
    group = 'build'
    description = 'Collects Fabric release artifacts and SHA-256 checksums.'
    dependsOn tasks.named('build')
    artifacts.from(tasks.named('jar').flatMap { it.archiveFile })
    artifacts.from(tasks.named('sourcesJar').flatMap { it.archiveFile })
    licenseFile.set(layout.projectDirectory.file('LICENSE'))
    changelogFile.set(layout.projectDirectory.file('changelog.txt'))
    destinationDirectory.set(releaseDirectory)
}

// Select bounded reruns without changing the normal acceptance descriptor.
def clientAcceptanceSuite = providers.gradleProperty('warlockeryClientSuite').orElse('all')
tasks.named('processGametestResources') {
    inputs.property('clientAcceptanceSuite', clientAcceptanceSuite)
    filesMatching('fabric.mod.json') {
        filter { line ->
            def selected = [
                books: ['AllBooksClientAcceptance'],
                diagonal_chalk: ['DiagonalChalkClientAcceptance'],
                louse: ['LouseAbilitiesClientAcceptance'],
                placed_mirrors: ['PlacedMirrorAbilitiesClientAcceptance'],
                grave_doors: ['GraveAndDoorAbilitiesClientAcceptance'],
                crafting: ['CraftingCatalogAcceptance'],
                items: ['AllItemsClientAcceptance'],
                dolls: ['DollAbilitiesClientAcceptance'],
                specialty: ['SpecialtyToolsClientAcceptance'],
                brew_world: ['BrewWorldAbilitiesClientAcceptance'],
                equipment: ['EquipmentAbilitiesClientAcceptance'],
                ritual_tools: ['RitualToolsAbilitiesClientAcceptance'],
                brew_nature: ['BrewNatureAbilitiesClientAcceptance'],
                brew_summoning: ['BrewSummoningAbilitiesClientAcceptance'],
                devices: ['DeviceAbilitiesClientAcceptance'],
                fluids: ['FluidAbilitiesClientAcceptance'],
                equipment_sets: ['EquipmentSetAbilitiesClientAcceptance'],
                utility_tools: ['UtilityToolsAbilitiesClientAcceptance'],
                brew_combat: ['BrewCombatAbilitiesClientAcceptance'],
                brew_terrain: ['BrewTerrainAbilitiesClientAcceptance'],
                resource_items: ['ResourceItemsAbilitiesClientAcceptance'],
                remaining_tools: ['RemainingToolsAbilitiesClientAcceptance'],
                other_devices: ['OtherDevicesAbilitiesClientAcceptance'],
                device_combat: ['DeviceAbilitiesClientAcceptance', 'BrewCombatAbilitiesClientAcceptance'],
                brew_regressions: ['BrewCombatAbilitiesClientAcceptance', 'BrewSummoningAbilitiesClientAcceptance', 'BrewTerrainAbilitiesClientAcceptance'],
                utility_resources: ['UtilityToolsAbilitiesClientAcceptance', 'ResourceItemsAbilitiesClientAcceptance'],
                remaining_devices: ['RemainingToolsAbilitiesClientAcceptance', 'OtherDevicesAbilitiesClientAcceptance'],
                new_acquisition: ['CraftingCatalogAcceptance', 'RecipeBookAcceptance'],
                brew_remaining: ['BrewRemainingAbilitiesClientAcceptance'],
                brew_advanced: ['BrewAdvancedAbilitiesClientAcceptance'],
                brew_potion_effects: ['BrewPotionEffectsAbilitiesClientAcceptance'],
                viewers: ['RecipeViewerAcceptance'],
                recipebook: ['RecipeBookAcceptance'],
                operational: ['JeiCatalogAcceptance', 'MachineWalkthroughAcceptance', 'RitualWalkthroughAcceptance'],
                walkthroughs: ['RitualWalkthroughAcceptance', 'MachineWalkthroughAcceptance'],
                rituals: ['RitualWalkthroughAcceptance'],
                machines: ['MachineWalkthroughAcceptance'],
                catalogue: ['JeiCatalogAcceptance']
            ][clientAcceptanceSuite.get()]
            if (selected != null && line.contains('"fabric-client-gametest"')) {
                return '    "fabric-client-gametest": [' + selected.collect { '"com.kadamitas.warlockery.client.' + it + '"' }.join(', ') + '],'
            }
            return line
        }
    }
}
