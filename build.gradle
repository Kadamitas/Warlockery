
plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.143'
}

abstract class ReleaseBundleTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getArtifacts()

    @InputFile
    abstract RegularFileProperty getLicenseFile()

    @InputFile
    abstract RegularFileProperty getChangelogFile()

    @OutputDirectory
    abstract DirectoryProperty getDestinationDirectory()

    @TaskAction
    void createBundle() {
        def destination = destinationDirectory.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination)

        [licenseFile.get().asFile, changelogFile.get().asFile].each { source ->
            java.nio.file.Files.copy(
                source.toPath(),
                destination.resolve(source.name),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }

        artifacts.files.each { artifact ->
            java.nio.file.Files.copy(
                artifact.toPath(),
                destination.resolve(artifact.name),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                def buffer = new byte[8192]
                int bytesRead
                while ((bytesRead = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, bytesRead)
                }
            }
            def checksum = java.util.HexFormat.of().withUpperCase().formatHex(digest.digest())
            java.nio.file.Files.writeString(
                destination.resolve("${artifact.name}.sha256"),
                "${checksum}  ${artifact.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8
            )
        }
    }
}

abstract class GenerateEmptyGameTestStructure extends DefaultTask {
    @Input
    abstract Property<Integer> getStructureSize()

    @Input
    abstract Property<Integer> getDataVersion()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    @TaskAction
    void generate() {
        def output = outputFile.get().asFile.toPath()
        java.nio.file.Files.createDirectories(output.parent)
        def stream = new java.io.DataOutputStream(new java.util.zip.GZIPOutputStream(java.nio.file.Files.newOutputStream(output)))
        stream.withCloseable { data ->
            int size = structureSize.get()
            data.writeByte(10)
            data.writeUTF('')
            GenerateEmptyGameTestStructure.writeIntList(data, 'size', size, size, size)
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'entities', 0)
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'blocks', size * size * size)
            for (int y = 0; y < size; y++) {
                for (int x = 0; x < size; x++) {
                    for (int z = 0; z < size; z++) {
                        GenerateEmptyGameTestStructure.writeIntList(data, 'pos', x, y, z)
                        data.writeByte(3)
                        data.writeUTF('state')
                        data.writeInt(0)
                        data.writeByte(0)
                    }
                }
            }
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'palette', 1)
            data.writeByte(8)
            data.writeUTF('Name')
            data.writeUTF('minecraft:air')
            data.writeByte(0)
            data.writeByte(3)
            data.writeUTF('DataVersion')
            data.writeInt(dataVersion.get())
            data.writeByte(0)
        }
    }

    private static void writeIntList(final java.io.DataOutputStream data, final String name, final int... values) {
        data.writeByte(9)
        data.writeUTF(name)
        data.writeByte(3)
        data.writeInt(values.length)
        values.each { data.writeInt(it) }
    }

    private static void writeCompoundList(final java.io.DataOutputStream data, final String name, final int size) {
        data.writeByte(9)
        data.writeUTF(name)
        data.writeByte(10)
        data.writeInt(size)
    }
}

version = '1.2.2'
group = 'com.kadamitas.warlockery'

base {
    archivesName = 'warlockery-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gameTestResources')
def generateEmptyGameTestStructure = tasks.register('generateEmptyGameTestStructure', GenerateEmptyGameTestStructure) {
    structureSize.set(3)
    dataVersion.set(4_903)
    outputFile.set(generatedGameTestResources.map { it.file('data/warlockery/structure/empty3x3x3.nbt') })
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generatedGameTestResources
}

tasks.named('processResources', ProcessResources) {
    dependsOn generateEmptyGameTestStructure
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version
    }
    exclude 'assets/warlockery/icon.png'
    from('src/main/resources/assets/warlockery/icon.png') {
        into ''
        rename { 'warlockery-icon.png' }
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn generateEmptyGameTestStructure
}

sourceSets.test.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

neoForge {
    version = '26.2.0.37-beta'

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'warlockery'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            clientData()
            gameDirectory = layout.projectDirectory.dir('run-data')
            programArguments.addAll '--mod', 'warlockery', '--all', '--output', layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath, '--existing', layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
        }
    }

    mods {
        warlockery {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.warlockery
    }
}

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    mavenCentral()
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'mezz.jei:jei-26.2-common-api:30.15.0.104'
    compileOnly 'mezz.jei:jei-26.2-neoforge-api:30.15.0.104'
    localRuntime 'mezz.jei:jei-26.2-neoforge:30.15.0.104'
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
    }
}

afterEvaluate {
    tasks.named('test', Test) {
        workingDir = rootProject.projectDir
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-Warlockery.txt' }
    }
    from(rootProject.file('changelog.txt')) {
        into 'META-INF'
        rename { 'CHANGELOG-Warlockery.txt' }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Automatic-Module-Name': 'com.kadamitas.warlockery',
            'Specification-Title': 'Warlockery',
            'Specification-Vendor': 'Kadamitas',
            'Specification-Version': project.version,
            'Implementation-Title': 'Warlockery',
            'Implementation-Vendor': 'Kadamitas',
            'Implementation-Version': project.version,
            'Implementation-URL': 'https://github.com/Kadamitas/Warlockery'
        )
    }
}

def releaseDirectory = layout.projectDirectory.dir("release/neoforge/${project.version}")

tasks.register('releaseBundle', ReleaseBundleTask) {
    group = 'build'
    description = 'Collects release artifacts and SHA-256 checksums.'
    dependsOn tasks.named('build')
    artifacts.from(tasks.named('jar').flatMap { it.archiveFile })
    artifacts.from(tasks.named('sourcesJar').flatMap { it.archiveFile })
    licenseFile.set(layout.projectDirectory.file('LICENSE'))
    changelogFile.set(layout.projectDirectory.file('changelog.txt'))
    destinationDirectory.set(releaseDirectory)
}
