tasks.named('runGametest') {
    // SavedData survives a vanilla GameTestServer restart. Preserve the previous scratch
    // world for diagnosis, then start fresh so finite marriage names and other state cannot leak.
    doFirst {
        def scratchWorld = layout.buildDirectory.dir('gametest/world').get().asFile.toPath()
        if (java.nio.file.Files.exists(scratchWorld)) {
            def history = layout.buildDirectory.dir('gametest-history').get().asFile.toPath()
            java.nio.file.Files.createDirectories(history)
            def previous = java.nio.file.Files.createTempDirectory(history, 'previous-').resolve('world')
            java.nio.file.Files.move(scratchWorld, previous)
            logger.lifecycle("Preserved previous GameTest scratch world at " + previous)
        }
    }
    outputs.file layout.buildDirectory.file('gametest-results.xml')
}

