abstract class ReleaseBundleTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getArtifacts()

    @InputFile
    abstract RegularFileProperty getLicenseFile()

    @InputFile
    abstract RegularFileProperty getChangelogFile()

    @OutputDirectory
    abstract DirectoryProperty getDestinationDirectory()

    @TaskAction
    void createBundle() {
        def destination = destinationDirectory.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination)

        [licenseFile.get().asFile, changelogFile.get().asFile].each { source ->
            java.nio.file.Files.copy(
                source.toPath(),
                destination.resolve(source.name),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }

        artifacts.files.each { artifact ->
            java.nio.file.Files.copy(
                artifact.toPath(),
                destination.resolve(artifact.name),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                def buffer = new byte[8192]
                int bytesRead
                while ((bytesRead = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, bytesRead)
                }
            }
            def checksum = java.util.HexFormat.of().withUpperCase().formatHex(digest.digest())
            java.nio.file.Files.writeString(
                destination.resolve("${artifact.name}.sha256"),
                "${checksum}  ${artifact.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8
            )
        }
    }
}

abstract class GenerateEmptyGameTestStructure extends DefaultTask {
    @Input abstract Property<Integer> getStructureSize()
    @Input abstract Property<Integer> getDataVersion()
    @Input abstract Property<Boolean> getSparse()
    @OutputFile abstract RegularFileProperty getOutputFile()
    @TaskAction void generate() {
        def output = outputFile.get().asFile.toPath()
        java.nio.file.Files.createDirectories(output.parent)
        new java.io.DataOutputStream(new java.util.zip.GZIPOutputStream(java.nio.file.Files.newOutputStream(output))).withCloseable { data ->
            int size = structureSize.get(); data.writeByte(10); data.writeUTF('')
            GenerateEmptyGameTestStructure.writeIntList(data, 'size', size, size, size)
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'entities', 0)
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'blocks', sparse.get() ? 0 : size * size * size)
            if (!sparse.get()) {
                for (int y=0;y<size;y++) for (int x=0;x<size;x++) for (int z=0;z<size;z++) {
                    GenerateEmptyGameTestStructure.writeIntList(data, 'pos', x, y, z)
                    data.writeByte(3); data.writeUTF('state'); data.writeInt(0); data.writeByte(0)
                }
            }
            GenerateEmptyGameTestStructure.writeCompoundList(data, 'palette', sparse.get() ? 0 : 1)
            if (!sparse.get()) {
                data.writeByte(8); data.writeUTF('Name'); data.writeUTF('minecraft:air'); data.writeByte(0)
            }
            data.writeByte(3); data.writeUTF('DataVersion'); data.writeInt(dataVersion.get()); data.writeByte(0)
        }
    }
    private static void writeIntList(java.io.DataOutputStream data,String name,int... values){data.writeByte(9);data.writeUTF(name);data.writeByte(3);data.writeInt(values.length);values.each{data.writeInt(it)}}
    private static void writeCompoundList(java.io.DataOutputStream data,String name,int size){data.writeByte(9);data.writeUTF(name);data.writeByte(10);data.writeInt(size)}
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gameTestResources')
def generateEmptyGameTestStructure = tasks.register('generateEmptyGameTestStructure', GenerateEmptyGameTestStructure) {
    structureSize.set(3); dataVersion.set(4_903); sparse.set(false)
    outputFile.set(generatedGameTestResources.map { it.file('data/warlockery/structure/empty3x3x3.nbt') })
}
def generateLargeGameTestStructure = tasks.register('generateLargeGameTestStructure', GenerateEmptyGameTestStructure) {
    structureSize.set(15); dataVersion.set(4_903); sparse.set(false)
    outputFile.set(generatedGameTestResources.map { it.file('data/warlockery/structure/empty15x15x15.nbt') })
}
def generateIsolationGameTestStructure = tasks.register('generateIsolationGameTestStructure', GenerateEmptyGameTestStructure) {
    structureSize.set(32); dataVersion.set(4_903); sparse.set(true)
    outputFile.set(generatedGameTestResources.map { it.file('data/warlockery/structure/empty32x32x32.nbt') })
}

sourceSets.main.resources { srcDir 'src/generated/resources'; srcDir generatedGameTestResources }

loom {
    runs {
        gametest {
            server()
            name = 'Warlockery GameTest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg '-Dfabric-tag-conventions-v2.missingTagTranslationWarning=VERBOSE'
            runDir 'build/gametest'
        }
    }
}

def recipeViewer = providers.gradleProperty('warlockeryRecipeViewer').orElse('jei').get()
if (!['jei', 'rei', 'rrv', 'emi', 'none'].contains(recipeViewer)) throw new GradleException('Unsupported recipe viewer profile: ' + recipeViewer)

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.cassian.cc' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly 'me.shedaniel:RoughlyEnoughItems-api-fabric:26.2.820'
    compileOnly 'me.shedaniel:RoughlyEnoughItems-fabric:26.2.820'
    compileOnly 'dev.architectury:architectury-fabric:21.0.2'
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    compileOnly 'cc.cassian.rrv:reliable-recipe-viewer-fabric:8.10.4+26.2'
    compileOnly('curse.maven:emi-unofficial-port-unstable-1544558:8616656') { transitive = false }
    if (recipeViewer == 'rei') {
        runtimeOnly 'me.shedaniel:RoughlyEnoughItems-fabric:26.2.820'
        runtimeOnly 'dev.architectury:architectury-fabric:21.0.2'
        runtimeOnly 'me.shedaniel.cloth:cloth-config-fabric:26.2.155'
    }
    if (recipeViewer == 'rrv') runtimeOnly 'cc.cassian.rrv:reliable-recipe-viewer-fabric:8.10.4+26.2'
    if (recipeViewer == 'emi') runtimeOnly 'curse.maven:emi-unofficial-port-unstable-1544558:8616656'
    compileOnly 'mezz.jei:jei-26.2-fabric-api:30.7.0.41'
    if (recipeViewer == 'jei') runtimeOnly 'mezz.jei:jei-26.2-fabric:30.7.0.41'

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'warlockery_client_tests'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

dependencies {
    gametestCompileOnly 'mezz.jei:jei-26.2-fabric-api:30.7.0.41'
    if (recipeViewer == 'jei') gametestRuntimeOnly 'mezz.jei:jei-26.2-fabric:30.7.0.41'
}

