name: Publish to CurseForge

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        default: v1.5.0
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - name: Validate publishing configuration
        shell: bash
        run: |
          test -n "$CURSEFORGE_API_TOKEN" || { echo "CURSEFORGE_API_TOKEN is not configured"; exit 1; }
          test -n "$CURSEFORGE_PROJECT_ID" || { echo "CURSEFORGE_PROJECT_ID is not configured"; exit 1; }
          test -n "$RELEASE_TAG" || { echo "A GitHub release tag is required"; exit 1; }

      - name: Download release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern "warlockery-${version}.jar" \
            --pattern "warlockery-neoforge-${version}.jar"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > artifacts/changelog.md
          test -s "artifacts/warlockery-${version}.jar"
          test -s "artifacts/warlockery-neoforge-${version}.jar"
          test -s artifacts/changelog.md

      - name: Publish loader files
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_type="$REQUESTED_RELEASE_TYPE"
          if [[ -z "$release_type" ]]; then
            if [[ "${RELEASE_TAG,,}" == *alpha* ]]; then
              release_type="alpha"
            elif [[ "${RELEASE_TAG,,}" == *beta* || "$RELEASE_IS_PRERELEASE" == "true" ]]; then
              release_type="beta"
            else
              release_type="release"
            fi
          fi

          versions_json="$(curl --silent --show-error --fail-with-body \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions")"

          resolve_version() {
            local requested="$1"
            jq --raw-output --arg requested "$requested" \
              '[.[] | select((.name | ascii_downcase) == ($requested | ascii_downcase))][0].name // empty' \
              <<< "$versions_json"
          }

          minecraft_version="$(resolve_version "26.2")"
          client_version="$(resolve_version "Client")"
          server_version="$(resolve_version "Server")"
          java_version="$(resolve_version "Java 25")"
          test -n "$minecraft_version" || { echo "CurseForge does not list Minecraft 26.2"; exit 1; }

          publish_file() {
            local loader="$1"
            local file="$2"
            local loader_version
            local display_name
            local metadata
            local response
            local file_id
            loader_version="$(resolve_version "$loader")"
            test -n "$loader_version" || { echo "CurseForge does not list loader $loader"; exit 1; }
            display_name="Warlockery ${version} for ${loader}"

            version_names="$(jq --null-input --compact-output \
              --arg minecraft "$minecraft_version" \
              --arg loader "$loader_version" \
              --arg client "$client_version" \
              --arg server "$server_version" \
              --arg java "$java_version" \
              '[$minecraft, $loader, $client, $server, $java] | map(select(length > 0))')"
            metadata="$(jq --null-input --compact-output \
              --arg changelog "$(cat artifacts/changelog.md)" \
              --arg displayName "$display_name" \
              --arg releaseType "$release_type" \
              --argjson gameVersionNames "$version_names" \
              '{changelog: $changelog, changelogType: "markdown", displayName: $displayName, gameVersionNames: $gameVersionNames, releaseType: $releaseType}')"

            response="$(curl --silent --show-error --fail-with-body \
              --request POST \
              --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
              --form-string "metadata=$metadata" \
              --form "file=@${file}" \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
            file_id="$(jq --exit-status --raw-output .id <<< "$response")"
            echo "| ${loader} | ${file_id} | ${release_type} |" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "## CurseForge publication"
            echo
            echo "| Loader | File ID | Channel |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          publish_file "Forge" "artifacts/warlockery-${version}.jar"
          publish_file "NeoForge" "artifacts/warlockery-neoforge-${version}.jar"
