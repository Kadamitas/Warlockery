[[mods]]
modId="warlockery"
rrv_client="com.kadamitas.warlockery.compat.rrv.WarlockeryRrvPlugin"
version="${mod_version}"
displayName="Warlockery"
displayURL="https://github.com/Kadamitas/Warlockery"
updateJSONURL="https://raw.githubusercontent.com/Kadamitas/Warlockery/neoforge-main/update.json"
iconFile="warlockery-icon.png"
iconBlur=false
authors="Kadamitas"

description='''A standalone ritual-magic mod for NeoForge and Minecraft 26.3.
Warlockery includes data-driven circles and machines, magical plants, sympathetic magic,
dolls, supernatural forms, creatures and bosses, goblin raids, peaceful travelling hobgoblins,
silver-equipped Werewolf Hunters, and modern ore progression.'''

[features.warlockery]
    javaVersion="[25,)"

